services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in backend/.env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in backend/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
    volumes:
      - retail-inventory-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in backend/.env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in backend/.env}
      OWNER_INITIAL_PASSWORD: ${OWNER_INITIAL_PASSWORD:?Set OWNER_INITIAL_PASSWORD in backend/.env}
      MANAGER_INITIAL_PASSWORD: ${MANAGER_INITIAL_PASSWORD:?Set MANAGER_INITIAL_PASSWORD in backend/.env}
      STAFF_INITIAL_PASSWORD: ${STAFF_INITIAL_PASSWORD:?Set STAFF_INITIAL_PASSWORD in backend/.env}
    command: >
      sh -c "uv run --no-sync python -m backend.create_tables &&
             uv run --no-sync python -m backend.seed &&
             exec uv run --no-sync gunicorn --bind 0.0.0.0:8000 backend.main:app"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  retail-inventory-data:
