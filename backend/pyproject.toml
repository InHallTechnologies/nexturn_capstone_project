[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kuldeep Choudhary", email = "choudharykuldeep2002@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "bcrypt>=4.0",
    "flask>=3.1.3",
    "gunicorn>=23.0",
    "psycopg[binary]>=3.3.6",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
